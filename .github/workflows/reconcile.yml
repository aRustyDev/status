name: Reconcile branch previews
on:
  workflow_call:
    inputs:
      config:
        type: string
        default: .github/previews.yml
      fixture:
        description: Status-hosted private fixture integration
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
env:
  PREVIEW_CONTROL_DIR: ${{ format('{0}/control', github.workspace) }}
  PREVIEW_SOURCE_REPOSITORY: ${{ inputs.fixture && 'aRustyDev/branch-previews-fixture' || github.repository }}
  PREVIEW_REPOSITORY_ID: ${{ inputs.fixture && '1474000552' || github.repository_id }}
  PREVIEW_DEFAULT_BRANCH: ${{ inputs.fixture && 'main' || github.event.repository.default_branch }}
  PREVIEW_HOST_BRANCH: ${{ github.event.repository.default_branch }}
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (!inputs.fixture || github.repository_id == '1468279539')
    environment: staging-preview
    concurrency:
      group: ${{ inputs.fixture && 'branch-preview-fixture-controller' || format('{0}-branch-preview-controller', github.event.repository.name) }}
      queue: max
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.10.0
      - name: Verify fixture repository identity and credential
        if: inputs.fixture
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FIXTURE_SOURCE_READ_TOKEN }}
        run: |-
          test -n "$GH_TOKEN"
          test "$(gh api "repos/$PREVIEW_SOURCE_REPOSITORY" --jq .id)" = "$PREVIEW_REPOSITORY_ID"
      - name: Check out the source repository's default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.fixture && 'aRustyDev/branch-previews-fixture' || github.repository }}
          ref: ${{ inputs.fixture && 'main' || github.event.repository.default_branch }}
          path: control
          persist-credentials: false
          token: ${{ inputs.fixture && secrets.FIXTURE_SOURCE_READ_TOKEN || github.token }}
      - uses: aRustyDev/status/.github/actions/branch-previews@e54cf1244abc62706af7ca80897ba49e2d410cf8
        with:
          operation: reconcile
          config: ${{ inputs.config }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_SOURCE_TOKEN: ${{ inputs.fixture && secrets.FIXTURE_SOURCE_READ_TOKEN || github.token }}
          PREVIEW_BRANCH_CONFIG: ${{ secrets[inputs.fixture && 'FIXTURE_BRANCH_CONFIG' || 'PREVIEW_BRANCH_CONFIG'] }}
          PREVIEW_WORKER_SECRETS: ${{ secrets[inputs.fixture && 'FIXTURE_WORKER_SECRETS' || 'PREVIEW_WORKER_SECRETS'] }}
          CLOUDFLARE_API_TOKEN: ${{ secrets[inputs.fixture && 'FIXTURE_CLOUDFLARE_API_TOKEN' || 'CLOUDFLARE_BRANCH_PREVIEW_API_TOKEN'] }}
          FLAGSHIP_APP_ID: ${{ vars[inputs.fixture && 'FIXTURE_FLAGSHIP_APP_ID' || 'FLAGSHIP_APP_ID'] }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars[inputs.fixture && 'FIXTURE_CLOUDFLARE_ACCOUNT_ID' || 'CLOUDFLARE_ACCOUNT_ID'] }}
