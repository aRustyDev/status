name: Fixture branch previews
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy, or empty for reconciliation
        required: false
        type: string
      sha:
        description: Exact tested commit
        required: false
        type: string
  schedule:
    - cron: 37 * * * *
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    if: vars.FIXTURE_PREVIEW_ENABLED == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.branch != '' && inputs.sha != ''))
    uses: aRustyDev/status/.github/workflows/deploy.yml@3e08bf162be6b1c6b5371df91c4886da83de1afc
    with:
      fixture: true
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
  reconcile:
    if: vars.FIXTURE_PREVIEW_ENABLED == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.branch == ''))
    permissions:
      contents: read
      actions: write
    uses: aRustyDev/status/.github/workflows/reconcile.yml@3e08bf162be6b1c6b5371df91c4886da83de1afc
    with:
      fixture: true
