name: Staging preview

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        required: true
        options: [deploy, list, rollback, release]
      slot:
        type: choice
        required: true
        options: ['1', '2', '3', '4', '5', '6']
      branch:
        description: Same-repository branch to deploy or manage
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: status-preview-slot-${{ inputs.slot }}
  queue: max

jobs:
  build:
    if: inputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate branch input
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          test -n "$BRANCH"
          git check-ref-format "refs/heads/$BRANCH"
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ inputs.branch }}
          persist-credentials: false
          path: feature
      - uses: actions/setup-node@v7
        with:
          node-version-file: feature/.nvmrc
      - name: Build feature assets
        working-directory: feature
        run: |
          npm ci
          npm run build -w @bsp/shared
          npm run build -w @bsp/board
          npm run build -w @bsp/status
          npm run build -w @bsp/admin
          git rev-parse HEAD > .preview-commit
      - name: Package source and assets
        run: tar --exclude='feature/node_modules' --exclude='feature/.git' -czf feature.tar.gz feature
      - uses: actions/upload-artifact@v7
        with:
          name: feature-${{ github.run_id }}
          path: feature.tar.gz
          retention-days: 1

  manage:
    if: always() && (inputs.action != 'deploy' || needs.build.result == 'success')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging-preview
    steps:
      - name: Check out trusted deployment tooling
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        if: inputs.action == 'deploy'
        with:
          name: feature-${{ github.run_id }}
      - name: Prepare feature source
        if: inputs.action == 'deploy'
        run: |
          tar -xzf feature.tar.gz
          npm ci --ignore-scripts --prefix feature
      - name: Manage preview
        env:
          PREVIEW_ACTION: ${{ inputs.action }}
          PREVIEW_SLOT: ${{ inputs.slot }}
          PREVIEW_BRANCH: ${{ inputs.branch }}
          PREVIEW_STAGING_CONFIG: ${{ secrets.PREVIEW_STAGING_CONFIG }}
          FLAGSHIP_APP_ID: ${{ vars.FLAGSHIP_APP_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
        run: node scripts/preview/manage.mjs
