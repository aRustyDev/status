name: Reusable preview controller tests
on:
  pull_request:
    paths: ['.github/actions/branch-previews/**', '.github/workflows/test-branch-previews.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/actions/branch-previews
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.10.0
      - run: npm ci --ignore-scripts
      - run: npm test
